[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "playbook"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "flet==0.24.1",
    "mutagen>=1.46.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov",
    "flake8",
    "black",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short --import-mode=importlib --cov=playbook --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/playbook"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 88
target-version = ["py310"]